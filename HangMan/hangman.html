<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="hangman.css">
    <title>HangMan Game</title>
</head>
<body>

    <h1>HangMan Game</h1>
    <div class="container">
        <div class="hangMan-container">
            <div class="hangContent">
                <div class="HangMan">
                    <div class="eleven"></div>
                    <div class="ten"></div>
                    <div class="nine"></div>
                    <div class="eight"></div>
                    <div class="seven"></div>
                    <div class="six"></div>
                    <div class="five"></div>
                    <div class="four"></div>
                    <div class="three"></div>
                    <div class="two"></div>
                    <div class="one"></div>
                </div>
                <div class="words">
                    <div class="input"> 
                        <div class="one">b</div>
                        <div class="two">t</div>
                        <div class="three">l</div>
                        <div class="four">i</div>
                        <div class="five">o</div>
                        <div class="six">u</div>
                        <div class="seven">r</div>
                        <div class="eight">f</div>
                        <div class="nine">d</div>
                        <div class="ten">m</div>
                        <div class="seven">x</div>
                        <div class="eight">a</div>
                        <div class="nine">q</div>
                        <div class="ten">s</div>
                        <div class="seven">g</div>
                        <div class="eight">e</div>
                        <div class="nine">c</div>
                        <div class="ten">k</div>
                        <div class="ten">p</div>
                        <div class="ten">z</div>
                        <div class="ten">v</div>
                        <div class="ten">y</div>
                        <div class="ten">j</div>
                        <div class="ten">h</div>
                        <div class="ten">w</div>
                        <div class="ten">n</div>
                    </div>
                    <div class="chosen">
                        <div class="one"></div>
                    </div>
                </div>
            </div>
            <div class="result"></div>
        </div>
    </div>


    <script src="hangman.js"></script>
</body>
</html>
