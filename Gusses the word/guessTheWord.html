<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="guessTheWord.css">
    <title>Guess The Word </title>
</head>
<body>

<h1>Guess The Word</h1> 


<div class="the-game">
    <div class="guess-game">
        <div class="rows"></div>
        <div class="buttons">
            <button class="check">check</button>
            <button class="hint">hint <span></span></button>
            <button class="reset">reset</button>
        </div> 
    </div>
    <div class="keys">
        <div class="key in-place">letter is right and in place</div>
        <div class="key not-in-place">letter is right but not in place</div>
        <div class="key no">letter is wrong and not in place</div>
        <div class="the-result">

        </div>
    </div> 
</div>


    <script src="guessTheWord.js"></script>
</body>
</html>
